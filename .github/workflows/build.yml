name: 编译并运行 Project

# 分支名 edidada/JH_projN → 构建 N_project；
# 其他分支（如 edidada/JH）默认构建 1_project（沿用原逻辑）。
on:
  push:
    branches:
      - 'edidada/**'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 需要读取根提交 da04424 中未经改动的 createimage.given
          fetch-depth: 0

      - name: 安装 32 位编译与运行工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-i386 lib32gcc-s1

      - name: 解析分支名，定位项目目录
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          echo "分支: $BRANCH"
          if [[ "$BRANCH" =~ ^edidada/JH_proj([0-9]+)$ ]]; then
            N="${BASH_REMATCH[1]}"
            PROJECT_DIR="${N}_project"
          else
            PROJECT_DIR="1_project"
          fi
          echo "项目目录: $PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/Makefile" ]; then
            echo "::error::找不到 $PROJECT_DIR/Makefile"
            exit 1
          fi
          echo "PROJ_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 编译并生成启动镜像（make）
        run: |
          set -e
          cd "$PROJ_DIR"
          make clean || true
          make
          ls -l image

      - name: 校验引导扇区签名
        run: |
          set -e
          cd "$PROJ_DIR"
          size=$(stat -c %s ./image)
          echo "image 大小: $size 字节"
          test $((size % 512)) -eq 0
          sig=$(od -An -tx1 -j510 -N2 ./image | tr -d ' \n')
          echo "引导扇区签名: 0x$sig"
          test "$sig" = "55aa"
          echo "编译运行成功"
